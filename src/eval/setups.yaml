# Setups the eval harness can run (owner: E, W5; model choices: C and D).
#
# A setup is a name that every results file, summary row and ablation refers
# to, so keep a name once it has results: add a new name for a new model,
# prompt or setting instead of editing one. The model ids are OpenRouter or
# Ollama ids; check them on openrouter.ai/models before a run.
#
#   python -m src.eval.harness classify --setup NAME --test FILE --name heldout
#   python -m src.eval.harness agent    --setup NAME --test FILE --name heldout

# Classifier setups (harness v1): run through classify(text) only. These are
# also the classifiers the chat page, re-runs and /admin can pick
# (src/models/classifier.py make_classifier). Any setup whose files are
# present shows as installed.
#   kind     keyword (the stub) | hf (a Hugging Face sequence classifier)
#   weights  folder with config.json, model.safetensors and the tokenizer,
#            relative to the repo root. src/models/fine_tuning is gitignored:
#            copy the weights there by hand (docs/deployment.md).
#   label    name shown in the pickers
#   max_length   tokens kept from the resident's text
#   temperature  softmax temperature for the confidences (1 = as trained);
#                fit on a validation set so E3's thresholds mean the same for every classifier
# Planned (not here yet): *_probe setups, the untuned base model with a head
# trained on top ({base, head}), as the baseline for the fine-tuned ones.
classifier:
  keyword_stub: {kind: keyword, label: Keyword stub}
  distilroberta_lora:
    kind: hf
    label: DistilRoBERTa (fine-tuned)
    weights: src/models/fine_tuning/distilroberta
    max_length: 256
    temperature: 1.0
  modernbert_lora:
    kind: hf
    label: ModernBERT-base (fine-tuned)
    weights: src/models/fine_tuning/ModernBERT-base
    max_length: 512
    temperature: 1.0

# Agent setups (harness v2): the whole agent, end to end.
#   provider, model  passed to src.models.llm.chat
#   key_env          environment variable holding the OpenRouter key (read at run
#                    time only; never written to results, cache or manifests)
#   classifier       classifier setup behind the agent's classifier tool
agent:
  ollama_qwen3_4b:
    provider: ollama
    model: "qwen3:4b-instruct"
    classifier: keyword_stub
  haiku:
    provider: openrouter
    model: anthropic/claude-haiku-5.5
    key_env: OPENROUTER_API_KEY
    classifier: keyword_stub
  sonnet:
    provider: openrouter
    model: anthropic/claude-sonnet-5.5
    key_env: OPENROUTER_API_KEY
    classifier: keyword_stub

# LLM judge setups (metrics.md section 5). The rubric is a prompt file in the
# Supabase config (prompts/judge/...), owned by F.
judge:
  sonnet_judge:
    provider: openrouter
    model: anthropic/claude-sonnet-5.5
    key_env: OPENROUTER_API_KEY
    rubric: judge/judge_v1.md
